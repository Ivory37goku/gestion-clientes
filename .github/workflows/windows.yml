name: Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Build installer and portable app
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: gestion-clientes-windows
          path: desktop-dist/*.exe
