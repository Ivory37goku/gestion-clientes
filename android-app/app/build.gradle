plugins {
    id 'com.android.application'
}

def webAppRoot = rootProject.projectDir.parentFile
tasks.register('syncWebAssets', Sync) {
    from(webAppRoot) {
        include 'index.html', 'cliente.html', 'app.js', 'styles.css', 'manifest.json', 'sw.js', 'supabase-config.js'
        include 'icon-192.png', 'icon-512.png', 'icon-512-maskable.png', 'brand-icon.svg'
    }
    from(new File(webAppRoot, 'vendor')) {
        into 'vendor'
        include 'supabase.js', 'SUPABASE-LICENSE.txt'
    }
    into layout.projectDirectory.dir('src/main/assets')
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('syncWebAssets')
}

android {
    namespace 'com.ivory37.gestionclientes'
    compileSdk 37

    defaultConfig {
        applicationId 'com.ivory37.gestionclientes'
        minSdk 24
        targetSdk 34
        versionCode 15
        versionName '1.0.15'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.18.0'
}
